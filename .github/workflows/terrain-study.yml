name: Terrain study (manual)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Number of benchmark workers
        required: false
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  full-study:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          enable-cache: true
      - run: uv sync --frozen --python 3.13 --extra plot
      - name: Run frozen full protocol
        env:
          BENCHMARK_WORKERS: ${{ inputs.workers }}
          STUDY_OUTPUT_DIR: ${{ runner.temp }}/terrain-full
        run: uv run run-terrain-benchmarks --profile full --workers "$BENCHMARK_WORKERS" --output-dir "$STUDY_OUTPUT_DIR"
      - name: Upload study records and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-study-${{ github.run_id }}
          path: ${{ runner.temp }}/terrain-full/
          if-no-files-found: warn
